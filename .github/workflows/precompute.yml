name: Precompute Through Time plans
# Run by hand from the Actions tab ("Run workflow"). One job per rule set runs on its own GitHub machine, so nothing uses your PC.
# Each job uploads its result JSONs as an artifact; download them all, then merge with tools/merge-through-time.js.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/precompute.yml']
  workflow_dispatch:
    inputs:
      filter:
        description: 'Regex on "kind|name" to limit the jobs (empty = all rule sets)'
        required: false
        default: ''
      extra:
        description: 'Extra chains file (default extra-chains.json; "none" to skip)'
        required: false
        default: 'extra-chains.json'

concurrency:
  group: precompute
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        job:
          - 'best\|default'
          - 'best\|obey off'
          - 'best\|VC off'
          - 'best\|FRLG on Switch'
          - 'best\|gifts off'
          - 'best\|TMs on'
          - 'best\|\+0'
          - 'best\|\+5'
          - '^chain\|(default|obey off|VC off|FRLG on Switch|gifts off|TMs on|\+0|\+5)$'
          - '^chain\|Solo'
          - '^chain\|Preset'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Plan
        env:
          PT_FILTER: ${{ matrix.job }}
          PT_WORKERS: 4
          PT_EXTRA: ${{ (inputs.extra == 'none' && '') || inputs.extra || 'extra-chains.json' }}
        run: |
          if [ -n "${{ inputs.filter }}" ] && ! echo "${{ matrix.job }}" | grep -Eiq "${{ inputs.filter }}"; then echo "skipped by filter"; mkdir -p out/results; exit 0; fi
          node tools/precompute-through-time.js out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-${{ strategy.job-index }}
          path: out/
          if-no-files-found: ignore

  collect:
    needs: plan
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: collected
          pattern: results-*
          merge-multiple: true
      - name: Commit the results back to the repo (so they can be pulled, no download needed)
        run: |
          mkdir -p results
          cp -r collected/results/. results/ 2>/dev/null || true
          cp collected/jobs.log results/jobs.log 2>/dev/null || true
          git config user.name "planner-batch"
          git config user.email "planner-batch@users.noreply.github.com"
          git add results
          git commit -m "Precomputed plan results" || echo "nothing to commit"
          git pull --rebase origin main
          git push origin main
