    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Plan all 323 post-Switch chains
        env:
          PT_WORKERS: 4
          PT_CONC: 8
          PT_RULES: ${{ matrix.rules }}
          PT_FULL: '1'
          PT_POOL: '1'
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "planner-batch"
          git config user.email "planner-batch@users.noreply.github.com"
          mkdir -p postswitch2
          f=$(node -e "const R=Object.assign({delta:2,obey:true,vc:true,frlgSwitch:false,gifts:true,tms:false},JSON.parse(process.env.PT_RULES));console.log(['obey','vc','frlgSwitch','gifts','tms'].map(k=>R[k]?1:0).join('')+'-d'+R.delta+'-ps.json')")
          if [ -f "postswitch2/$f" ]; then echo "skip $f (already done)"; exit 0; fi
          node tools/sweep-postswitch.js out
          cp "out/sweep/$f" "postswitch2/$f"
          tag="ps2-${f%-ps.json}"
          for i in 1 2 3 4 5; do
            gh release create "$tag" "out/full/$f.gz" --target postswitch-sweep --title "$tag" --notes "Full results, post-Switch chains, all versions, with carried pools" && break
            gh release delete "$tag" --cleanup-tag -y || true
            sleep 10
          done
          git add "postswitch2/$f"
          git commit -q -m "Post-Switch $f" || exit 0
          for i in $(seq 1 25); do
            git pull -q --rebase origin postswitch-sweep && git push -q origin HEAD:postswitch-sweep && break
            if [ -d .git/rebase-merge ] || [ -d .git/rebase-apply ]; then git rebase --abort; git reset -q --keep origin/postswitch-sweep; break; fi
            sleep $((RANDOM % 10 + 3))
          done
