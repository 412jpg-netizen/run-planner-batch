name: Sweep post-Switch DLC chains
# Plans every post-Switch chain that has DLC (Isle of Armor, Crown Tundra, Teal Mask, Indigo Disk, Mega Dimension): each DLC follows
# its base game in the same version, in release order; 4,050 chains per rule set, one rule set per machine, at most 6 at a time.
# Summaries go to postswitch-dlc/<flags>-d<delta>-dlc.json, full results (with carried pools) to releases psd1-<flags>-d<delta>.
on:
  push:
    branches: [postswitch-sweep]
    paths: ['.github/workflows/postswitch-dlc.yml']
  workflow_dispatch:

concurrency:
  group: postswitch-dlc
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  postswitch:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        rules: ['{"delta":2,"obey":true,"vc":true,"frlgSwitch":false,"gifts":true,"tms":false}', '{"delta":2,"obey":true,"vc":true,"frlgSwitch":true,"gifts":true,"tms":true}', '{"delta":2,"obey":true,"vc":true,"frlgSwitch":true,"gifts":true,"tms":false}', '{"delta":2,"obey":true,"vc":true,"frlgSwitch":true,"gifts":false,"tms":true}', '{"delta":2,"obey":true,"vc":true,"frlgSwitch":true,"gifts":false,"tms":false}', '{"delta":2,"obey":true,"vc":true,"frlgSwitch":false,"gifts":true,"tms":true}', '{"delta":2,"obey":true,"vc":true,"frlgSwitch":false,"gifts":false,"tms":true}', '{"delta":2,"obey":true,"vc":true,"frlgSwitch":false,"gifts":false,"tms":false}', '{"delta":2,"obey":true,"vc":false,"frlgSwitch":true,"gifts":true,"tms":true}', '{"delta":2,"obey":true,"vc":false,"frlgSwitch":true,"gifts":true,"tms":false}', '{"delta":2,"obey":true,"vc":false,"frlgSwitch":true,"gifts":false,"tms":true}', '{"delta":2,"obey":true,"vc":false,"frlgSwitch":true,"gifts":false,"tms":false}', '{"delta":2,"obey":true,"vc":false,"frlgSwitch":false,"gifts":true,"tms":true}', '{"delta":2,"obey":true,"vc":false,"frlgSwitch":false,"gifts":true,"tms":false}', '{"delta":2,"obey":true,"vc":false,"frlgSwitch":false,"gifts":false,"tms":true}', '{"delta":2,"obey":true,"vc":false,"frlgSwitch":false,"gifts":false,"tms":false}', '{"delta":2,"obey":false,"vc":true,"frlgSwitch":true,"gifts":true,"tms":true}', '{"delta":2,"obey":false,"vc":true,"frlgSwitch":true,"gifts":true,"tms":false}', '{"delta":2,"obey":false,"vc":true,"frlgSwitch":true,"gifts":false,"tms":true}', '{"delta":2,"obey":false,"vc":true,"frlgSwitch":true,"gifts":false,"tms":false}', '{"delta":2,"obey":false,"vc":true,"frlgSwitch":false,"gifts":true,"tms":true}', '{"delta":2,"obey":false,"vc":true,"frlgSwitch":false,"gifts":true,"tms":false}', '{"delta":2,"obey":false,"vc":true,"frlgSwitch":false,"gifts":false,"tms":true}', '{"delta":2,"obey":false,"vc":true,"frlgSwitch":false,"gifts":false,"tms":false}', '{"delta":2,"obey":false,"vc":false,